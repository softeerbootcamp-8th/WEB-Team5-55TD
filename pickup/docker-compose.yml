services:
  mysql:
    image: mysql:8.0
    container_name: pickup-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: pickup
      MYSQL_USER: pickup
      MYSQL_PASSWORD: pickup
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - pickup-mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: pickup-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pickup-redis-data:/data

volumes:
  pickup-mysql-data:
  pickup-redis-data:
