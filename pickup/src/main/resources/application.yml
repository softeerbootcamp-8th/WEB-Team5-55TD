spring:
  application:
    name: pickup
  profiles:
    default: dev
    group:
      local: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pickup?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:pickup}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
auth:
  token:
    issuer: ${JWT_ISSUER:pickup}
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
slack:
  enabled: ${SLACK_ENABLED:false}
  bot-token: ${SLACK_BOT_TOKEN:}
  channel: ${SLACK_CHANNEL:}
