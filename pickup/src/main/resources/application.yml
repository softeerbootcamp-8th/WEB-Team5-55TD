spring:
  application:
    name: pickup
  profiles:
    default: dev
    group:
      local: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pickup?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:pickup}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: pickup-pool
      register-mbeans: true
      data-source-properties:
        rewriteBatchedStatements: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:1s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
  task:
    scheduling:
      pool:
        size: 2
management:
  statsd:
    metrics:
      export:
        enabled: true
        flavor: datadog
        host: ${DD_AGENT_HOST:localhost}
        port: ${DD_DOGSTATSD_PORT:8125}
        protocol: udp
  metrics:
    tags:
      service: ${DD_SERVICE:pickup-api}
      env: ${DD_ENV:production}
      version: ${DD_VERSION:unknown}
auth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
  token:
    issuer: ${JWT_ISSUER:pickup}
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}

slack:
  enabled: ${SLACK_ENABLED:false}
  bot-token: ${SLACK_BOT_TOKEN:}
  channel: ${SLACK_CHANNEL:}

scheduler:
  enabled: ${SCHEDULER_ENABLED:true}
  auction:
    enabled: ${SCHEDULER_AUCTION_ENABLED:true}
    fixed-delay: ${SCHEDULER_AUCTION_FIXED_DELAY:1s}
  outbox:
    enabled: ${SCHEDULER_OUTBOX_ENABLED:false}
    fixed-delay: ${SCHEDULER_OUTBOX_FIXED_DELAY:200ms}
  card-sync:
    enabled: ${SCHEDULER_CARD_SYNC_ENABLED:true}
    cron: ${SCHEDULER_CARD_SYNC_CRON:0 0 */6 * * *}
    recent-days: ${SCHEDULER_CARD_SYNC_RECENT_DAYS:90}
    max-sets-per-run: ${SCHEDULER_CARD_SYNC_MAX_SETS_PER_RUN:10}

tcgdex:
  base-url: ${TCGDEX_BASE_URL:https://api.tcgdex.net/v2/en}
  timeout: ${TCGDEX_TIMEOUT:10s}

event:
  sqs:
    enabled: ${EVENT_SQS_ENABLED:false}
    queue-url: ${EVENT_SQS_QUEUE_URL:}
    region: ${EVENT_SQS_REGION:ap-northeast-2}
    wait-time: ${EVENT_SQS_WAIT_TIME:20s}
    visibility-timeout: ${EVENT_SQS_VISIBILITY_TIMEOUT:30s}
    max-messages: ${EVENT_SQS_MAX_MESSAGES:10}

image:
  storage:
    bucket: ${IMAGE_STORAGE_BUCKET:}
    region: ${IMAGE_STORAGE_REGION:}
    media-base-url: ${IMAGE_MEDIA_BASE_URL:}
    upload-url-ttl: ${IMAGE_UPLOAD_URL_TTL:5m}

realtime:
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS}
