spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
auth:
  cookie:
    secure: true
    same-site: None
image:
  storage:
    bucket: ${IMAGE_STORAGE_BUCKET:}
    region: ${IMAGE_STORAGE_REGION:}
    media-base-url: ${IMAGE_MEDIA_BASE_URL:}
    upload-url-ttl: ${IMAGE_UPLOAD_URL_TTL:5m}
