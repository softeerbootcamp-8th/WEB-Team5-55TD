spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 3000

slack:
  enabled: ${SLACK_ENABLED:true}
  channel: ${SLACK_CHANNEL:}

auth:
  cookie:
    secure: true
    same-site: None
image:
  storage:
    bucket: ${IMAGE_STORAGE_BUCKET:}
    region: ${IMAGE_STORAGE_REGION:}
    media-base-url: ${IMAGE_MEDIA_BASE_URL:}
    upload-url-ttl: ${IMAGE_UPLOAD_URL_TTL:5m}
