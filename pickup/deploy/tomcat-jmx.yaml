## dd-java-agent(JMXFetch)용 embedded Tomcat 지표 수집 설정.
##
## 설치 경로: /opt/datadog/jmx/tomcat.yaml (deploy.sh 가 배포마다 설치한다)
##
## 고칠 때 알아야 할 것
##
## - 파일명을 바꾸면 deploy/datadog.env 의 DD_JMXFETCH_CONFIG 도 함께 바꾼다.
## - MBean canonical name 의 property 순서에 의존하지 않도록 bean_regex 대신
##   domain_regex 와 type 으로 매칭한다.
## - deploy.sh 가 alias: tomcat.threads.busy 로 이 파일을 식별한다.
init_config:
  is_jmx: true

instances:
  - name: pickup-tomcat
    jvm_direct: true
    collect_default_jvm_metrics: false
    conf:
      - include:
          domain_regex: Catalina|Tomcat
          type: ThreadPool
          attribute:
            maxThreads:
              alias: tomcat.threads.max
              metric_type: gauge
            currentThreadCount:
              alias: tomcat.threads.count
              metric_type: gauge
            currentThreadsBusy:
              alias: tomcat.threads.busy
              metric_type: gauge
            minSpareThreads:
              alias: tomcat.threads.min
              metric_type: gauge
            connectionCount:
              alias: tomcat.connections.current
              metric_type: gauge
            keepAliveCount:
              alias: tomcat.connections.keep_alive
              metric_type: gauge
            maxConnections:
              alias: tomcat.connections.max
              metric_type: gauge

      - include:
          domain_regex: Catalina|Tomcat
          type: ProtocolHandler
          attribute:
            acceptCount:
              alias: tomcat.connections.accept_queue_max
              metric_type: gauge
            maxConnections:
              alias: tomcat.connections.max
              metric_type: gauge
            connectionCount:
              alias: tomcat.connections.current
              metric_type: gauge
            keepAliveCount:
              alias: tomcat.connections.keep_alive
              metric_type: gauge

      - include:
          domain_regex: Catalina|Tomcat
          type: GlobalRequestProcessor
          attribute:
            requestCount:
              alias: tomcat.request_count
              metric_type: counter
            errorCount:
              alias: tomcat.error_count
              metric_type: counter
            processingTime:
              alias: tomcat.processing_time
              metric_type: counter
            maxTime:
              alias: tomcat.max_time
              metric_type: gauge
            bytesReceived:
              alias: tomcat.bytes_rcvd
              metric_type: counter
            bytesSent:
              alias: tomcat.bytes_sent
              metric_type: counter
