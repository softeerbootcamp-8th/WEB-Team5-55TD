## dd-java-agent(JMXFetch)용 HikariCP 커넥션 풀 지표 수집 설정.
##
## 설치 경로: /opt/datadog/jmx/hikaricp.yaml (deploy.sh 가 배포마다 설치한다)
##
## 고칠 때 알아야 할 것
##
## - 파일명을 바꾸면 deploy/datadog.env 의 DD_JMXFETCH_CONFIG 도 함께 바꾼다.
## - 이 파일은 Datadog Agent 가 아니라 dd-java-agent 가 직접 읽는다.
##   /etc/datadog-agent/conf.d/ 아래에 두면 Agent 가 별도 체크로 로드하려다 실패한다.
## - HikariCP 7 은 풀 이름을 type 값 안에 괄호로 넣으므로(type=Pool (pickup-pool))
##   type 이 아니라 bean_regex 로 매칭한다. 캡처 그룹 $1 이 풀 이름이다.
## - deploy.sh 가 alias: hikaricp.connections.active 로 이 파일을 식별한다.
## - 전제: application.yml 의 spring.datasource.hikari.register-mbeans=true
init_config:
  is_jmx: true

instances:
  - name: pickup-hikaricp
    jvm_direct: true
    collect_default_jvm_metrics: false
    conf:
      - include:
          domain: com.zaxxer.hikari
          bean_regex:
            - 'com\.zaxxer\.hikari:type=Pool \((.*)\)'
          tags:
            pool: $1
          attribute:
            ActiveConnections:
              alias: hikaricp.connections.active
              metric_type: gauge
            IdleConnections:
              alias: hikaricp.connections.idle
              metric_type: gauge
            TotalConnections:
              alias: hikaricp.connections.total
              metric_type: gauge
            ThreadsAwaitingConnection:
              alias: hikaricp.connections.pending
              metric_type: gauge

      - include:
          domain: com.zaxxer.hikari
          bean_regex:
            - 'com\.zaxxer\.hikari:type=PoolConfig \((.*)\)'
          tags:
            pool: $1
          attribute:
            MaximumPoolSize:
              alias: hikaricp.connections.max
              metric_type: gauge
            MinimumIdle:
              alias: hikaricp.connections.min
              metric_type: gauge
