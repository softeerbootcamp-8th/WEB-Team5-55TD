## dd-java-agent(JMXFetch)용 Spring WebSocket 지표 수집 설정.
##
## 설치 경로: /opt/datadog/jmx/websocket.yaml
## RealtimeWebSocketJmxMetrics가 Spring 기본 통계를 숫자형 MBean attribute로 노출한다.

init_config:
  is_jmx: true

instances:
  - name: pickup-websocket
    jvm_direct: true
    collect_default_jvm_metrics: false
    conf:
      - include:
          bean: com.ootd.pickup.websocket:name=RealtimeWebSocketMetrics
          attribute:
            CurrentSessions:
              alias: pickup.websocket.sessions.current
              metric_type: gauge
            TotalSessions:
              alias: pickup.websocket.sessions.total
              metric_type: counter
            ConnectFailureSessions:
              alias: pickup.websocket.sessions.connect_failures
              metric_type: counter
            SendLimitExceededSessions:
              alias: pickup.websocket.sessions.send_limit_exceeded
              metric_type: counter
            TransportErrorSessions:
              alias: pickup.websocket.sessions.transport_errors
              metric_type: counter
            StompConnectCount:
              alias: pickup.websocket.stomp.connect
              metric_type: counter
            StompConnectedCount:
              alias: pickup.websocket.stomp.connected
              metric_type: counter
            StompDisconnectCount:
              alias: pickup.websocket.stomp.disconnect
              metric_type: counter
