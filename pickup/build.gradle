plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.ootd'
version = '0.0.1-SNAPSHOT'
description = 'pickup'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    implementation 'at.favre.lib:bcrypt:0.10.2'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // Spring Boot 4.1 은 Spring Framework 7 을 쓰므로 Spring 6 대상인 ShedLock 6.x 는 호환되지 않는다.
    implementation 'net.javacrumbs.shedlock:shedlock-spring:7.7.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.7.0'
    implementation platform('software.amazon.awssdk:bom:2.47.3')
    implementation 'software.amazon.awssdk:s3'
    // spring-cloud-aws-starter-sqs 는 최신(3.4.0)이 Spring Boot 3.5 대상이라 Boot 4.1 에서 쓸 수 없다.
    // S3 와 마찬가지로 SDK 를 직접 쓴다.
    implementation 'software.amazon.awssdk:sqs'
    implementation 'software.amazon.awssdk:url-connection-client'
    implementation 'software.amazon.awssdk:sso'
    implementation 'software.amazon.awssdk:ssooidc'
    implementation 'io.micrometer:micrometer-registry-statsd'
    // dd-java-agent(운영 -javaagent)가 인식하는 수동 계측 어노테이션과 CorrelationIdentifier(TraceContextCarrier가
    // 자동 계측 스팬의 traceId/spanId를 직접 읽을 때 씀).
    // 반드시 compileOnly여야 한다 — implementation으로 앱 자체 classloader에 이 jar를 번들하면, 에이전트가 부트스트랩
    // classloader에 심어 넣어 실제 트레이서에 연결해 주는 "진짜" CorrelationIdentifier 대신 앱이 번들한, 아무 트레이서에도
    // 연결되지 않은 별개의 사본이 로드되어 늘 "0"만 돌려준다(운영에서 실측 확인된 회귀). 에이전트가 없는 로컬·테스트
    // 실행에서 이 클래스가 아예 없을 수 있는 문제는 호출부(TraceContextCarrier)에서 NoClassDefFoundError를 잡아 대응한다.
    compileOnly 'com.datadoghq:dd-trace-api:1.64.2'
    // Outbox->SQS, 실행기 스레드 전환, Redis Pub/Sub처럼 비동기 경계를 넘나드는 트레이스를 수동으로 이어 붙이는 데 쓴다.
    // dd-java-agent가 이 API 호출을 자체 트레이서로 브릿지한다. 에이전트가 없으면 OpenTelemetry API 자체가 기본
    // no-op 구현으로 동작하므로 로컬/테스트에서도 부작용 없이 그냥 동작한다(compileOnly가 아니라 implementation인 이유).
    implementation 'io.opentelemetry:opentelemetry-api:1.42.1'

    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    // 도메인의 LocalDateTime은 UTC 벽시계라는 규약이라, 테스트 JVM의 기본 타임존이 실행 환경(로컬/CI)마다
    // 달라지면 H2가 계산하는 local datetime과 어긋난다. 실행 위치와 무관하게 UTC로 고정한다.
    systemProperty 'user.timezone', 'UTC'
    finalizedBy tasks.jacocoTestReport
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.jacocoTestReport {
    dependsOn tasks.test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    classDirectories.setFrom(
        files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/Q*.class'])
        })
    )
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        googleJavaFormat('1.19.2')
        removeUnusedImports()
        importOrder()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
