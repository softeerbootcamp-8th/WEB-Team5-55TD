# 백엔드 배포. main push 는 자동, 그 외 브랜치는 workflow_dispatch 로 수동 실행한다.
#
# 고칠 때 알아야 할 것
#
# - EC2 의 /home/ubuntu/pickup/.env 는 APP_ENV_ 블록과 pickup/deploy/datadog.env 를
#   합쳐 만든다. 커밋마다 바뀌거나 GitHub 에서 오는 값은 이 블록에, dd-java-agent 의
#   정적 설정은 그 파일에 둔다.
# - APP_ENV_ 접두사를 뗀 이름이 그대로 키가 되고, 여기 있는 값은 전부 필수다. 하나라도
#   비면 EC2 를 건드리기 전에 배포가 멈춘다. application.yml 기본값으로 충분하면 넣지 않는다.
# - 그 값에는 따옴표·역슬래시·개행을 쓸 수 없다. systemd 가 EnvironmentFile 을 읽을 때
#   해석해 다른 값이 된다.
# - TAG_SERVICE·TAG_ENVIRONMENT 는 배포 역할 IAM 정책의 ssm:resourceTag 조건과 같아야 한다.
#   어긋나면 조용히 권한 거부가 난다.
# - deploy.sh 와 인자 계약이 있고, wait 스텝은 deploy.sh 가 찍는 RESULT= / FAILED_APP_LOG=
#   마커를 파싱한다. 한쪽만 바꾸면 배포가 실패하거나 결과를 오판한다.
# - 환경변수 값은 SSM 명령에 싣지 않는다. 실행 기록과 CloudTrail 에 평문으로 남는다.
# - 배포는 직렬화하되 취소하지 않는다. 진행 중인 배포를 끊으면 서버가 어중간한 상태로 남는다.
# - wait 스텝의 set +e 와 인용하지 않은 instance_ids 는 의도된 것이다.
name: Backend CD

on:
  push:
    branches:
      - main
      - OOTD-412-웹소켓-부하테스트
    paths:
      - "pickup/**"
      - ".github/workflows/backend-cd.yml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-cd
  cancel-in-progress: false

jobs:
  ci:
    name: CI (build & test)
    uses: ./.github/workflows/backend-ci.yml
    with:
      upload-jar: true
    secrets: inherit

  deploy:
    name: Deploy via SSM
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_S3_BUCKET: ${{ vars.DEPLOY_S3_BUCKET }}
      S3_PREFIX: pickup/${{ github.sha }}
      TAG_SERVICE: pickup
      TAG_ENVIRONMENT: production

      APP_ENV_SPRING_PROFILES_ACTIVE: ${{ vars.SPRING_PROFILES_ACTIVE }}
      APP_ENV_JAVA_TOOL_OPTIONS: ${{ vars.JAVA_TOOL_OPTIONS }}

      APP_ENV_DB_URL: ${{ secrets.DB_URL }}
      APP_ENV_DB_USERNAME: ${{ secrets.DB_USERNAME }}
      APP_ENV_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      APP_ENV_DB_POOL_MAX_SIZE: ${{ vars.DB_POOL_MAX_SIZE }}
      APP_ENV_DB_POOL_MIN_IDLE: ${{ vars.DB_POOL_MIN_IDLE }}
      APP_ENV_DB_CONNECTION_TIMEOUT_MS: ${{ vars.DB_CONNECTION_TIMEOUT_MS }}

      APP_ENV_REDIS_HOST: ${{ secrets.REDIS_HOST }}
      APP_ENV_REDIS_PORT: ${{ vars.REDIS_PORT }}

      APP_ENV_JWT_ISSUER: ${{ vars.JWT_ISSUER }}
      APP_ENV_JWT_SECRET: ${{ secrets.JWT_SECRET }}
      APP_ENV_JWT_ACCESS_TOKEN_TTL: ${{ vars.JWT_ACCESS_TOKEN_TTL }}

      APP_ENV_SLACK_ENABLED: ${{ vars.SLACK_ENABLED }}
      APP_ENV_SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      APP_ENV_SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}

      APP_ENV_IMAGE_STORAGE_BUCKET: ${{ vars.IMAGE_STORAGE_BUCKET }}
      APP_ENV_IMAGE_STORAGE_REGION: ${{ vars.IMAGE_STORAGE_REGION }}
      APP_ENV_IMAGE_MEDIA_BASE_URL: ${{ vars.IMAGE_MEDIA_BASE_URL }}
      APP_ENV_IMAGE_UPLOAD_URL_TTL: ${{ vars.IMAGE_UPLOAD_URL_TTL }}

      APP_ENV_WEBSOCKET_ALLOWED_ORIGINS: ${{ vars.WEBSOCKET_ALLOWED_ORIGINS }}

      APP_ENV_EVENT_SQS_QUEUE_URL: ${{ secrets.EVENT_SQS_QUEUE_URL }}

      APP_ENV_DD_SERVICE: pickup-api
      APP_ENV_DD_ENV: production
      APP_ENV_DD_VERSION: ${{ github.sha }}

    steps:
      - name: Validate required configuration
        id: validate-config
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          missing=()
          [ -n "${AWS_REGION}" ]       || missing+=("vars.AWS_REGION")
          [ -n "${DEPLOY_S3_BUCKET}" ] || missing+=("vars.DEPLOY_S3_BUCKET")
          [ -n "${ROLE_ARN}" ]         || missing+=("secrets.AWS_DEPLOY_ROLE_ARN")

          app_keys=$(compgen -v | grep '^APP_ENV_' | sort)
          if [ -z "${app_keys}" ]; then
            echo "::error::APP_ENV_ 로 시작하는 런타임 환경변수가 하나도 없습니다."
            exit 1
          fi
          for name in ${app_keys}; do
            [ -n "${!name}" ] || missing+=("${name#APP_ENV_}")
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::다음 설정이 비어 있습니다: ${missing[*]}"
            exit 1
          fi

          invalid=()

          for name in ${app_keys}; do
            case "${!name}" in
              *\"*|*\\*|*\'*|*$'\n'*) invalid+=("${name#APP_ENV_}(따옴표·역슬래시·개행 불가)") ;;
            esac
          done

          check_format() {
            local name="APP_ENV_$1"
            [[ "${!name}" =~ $2 ]] || invalid+=("$1")
          }
          check_format SPRING_PROFILES_ACTIVE '^prod$'
          check_format DB_URL '^jdbc:mysql://.+$'
          check_format IMAGE_STORAGE_BUCKET '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          check_format IMAGE_STORAGE_REGION '^ap-northeast-2$'
          check_format IMAGE_MEDIA_BASE_URL '^https://[A-Za-z0-9.-]+$'
          check_format IMAGE_UPLOAD_URL_TTL '^[1-9][0-9]*[smhd]$'
          check_format WEBSOCKET_ALLOWED_ORIGINS '^https://[A-Za-z0-9.-]+$'
          check_format EVENT_SQS_QUEUE_URL '^https://sqs\.[a-z0-9-]+\.amazonaws\.com/[0-9]{12}/[A-Za-z0-9_-]+\.fifo$'
          check_format DD_SERVICE '^pickup-api$'
          check_format DD_ENV '^production$'
          check_format DD_VERSION '^[0-9a-f]{40}$'

          if [ ${#invalid[@]} -gt 0 ]; then
            echo "::error::다음 설정의 형식이 올바르지 않습니다: ${invalid[*]}"
            exit 1
          fi
          echo "런타임 환경변수 $(echo "${app_keys}" | wc -w | tr -d ' ')개 검증 완료"

      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Download application jar
        id: download-jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: artifact

      - name: Configure AWS credentials (OIDC)
        id: aws-auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-backend-cd-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve target instances
        id: resolve-targets
        run: |
          set -euo pipefail

          ids=$(aws ssm describe-instance-information \
            --filters "Key=tag:Service,Values=${TAG_SERVICE}" \
                      "Key=tag:Environment,Values=${TAG_ENVIRONMENT}" \
            --query 'InstanceInformationList[?PingStatus==`Online`].InstanceId' \
            --output text)

          if [ -z "${ids}" ]; then
            echo "::error::SSM 에 Online 으로 등록된 대상 인스턴스가 없습니다 (Service=${TAG_SERVICE}, Environment=${TAG_ENVIRONMENT})"

            echo "── 태그가 일치하는 인스턴스 (상태 무관) ──"
            aws ssm describe-instance-information \
              --filters "Key=tag:Service,Values=${TAG_SERVICE}" \
                        "Key=tag:Environment,Values=${TAG_ENVIRONMENT}" \
              --query 'InstanceInformationList[].{Id:InstanceId,Ping:PingStatus}' \
              --output table || true

            echo "── SSM 에 등록된 전체 인스턴스 ──"
            aws ssm describe-instance-information \
              --query 'InstanceInformationList[].{Id:InstanceId,Ping:PingStatus,Platform:PlatformName}' \
              --output table || true
            exit 1
          fi

          count=$(echo "${ids}" | wc -w | tr -d ' ')
          echo "instance_ids=${ids}" >> "$GITHUB_OUTPUT"
          echo "instance_count=${count}" >> "$GITHUB_OUTPUT"
          echo "대상 인스턴스 ${count}대: ${ids}"

      - name: Generate runtime env file
        id: runtime-env
        env:
          DATADOG_ENV_FILE: pickup/deploy/datadog.env
        run: |
          set -eu
          umask 077
          : > runtime.env
          for name in $(compgen -v | grep '^APP_ENV_' | sort); do
            printf '%s=%s\n' "${name#APP_ENV_}" "${!name}" >> runtime.env
          done

          if grep -vE '^\s*(#.*)?$' "${DATADOG_ENV_FILE}" | grep -qvE '^[A-Z][A-Z0-9_]*='; then
            echo "::error::${DATADOG_ENV_FILE} 에 KEY=값 형식이 아닌 줄이 있습니다"
            exit 1
          fi
          grep -E '^[A-Z][A-Z0-9_]*=' "${DATADOG_ENV_FILE}" >> runtime.env

          duplicated=$(cut -d= -f1 runtime.env | sort | uniq -d | paste -sd' ' -)
          if [ -n "${duplicated}" ]; then
            echo "::error::키가 중복됐습니다: ${duplicated}"
            exit 1
          fi

          echo "런타임 환경변수 $(wc -l < runtime.env | tr -d ' ')개 생성"
          cut -d= -f1 runtime.env | paste -sd' ' -

      - name: Upload jar and deploy script to S3
        id: upload
        run: |
          set -euo pipefail
          shopt -s nullglob

          jars=(artifact/pickup-*.jar)
          if [ ${#jars[@]} -ne 1 ]; then
            echo "::error::업로드할 jar 이 정확히 1개가 아닙니다: ${jars[*]:-(없음)}"
            exit 1
          fi

          aws s3 cp "${jars[0]}"            "s3://${DEPLOY_S3_BUCKET}/${S3_PREFIX}/app.jar"
          aws s3 cp pickup/deploy/deploy.sh "s3://${DEPLOY_S3_BUCKET}/${S3_PREFIX}/deploy.sh"
          aws s3 cp runtime.env             "s3://${DEPLOY_S3_BUCKET}/${S3_PREFIX}/runtime.env"
          aws s3 cp pickup/deploy/hikaricp-jmx.yaml "s3://${DEPLOY_S3_BUCKET}/${S3_PREFIX}/hikaricp-jmx.yaml"
          aws s3 cp pickup/deploy/tomcat-jmx.yaml "s3://${DEPLOY_S3_BUCKET}/${S3_PREFIX}/tomcat-jmx.yaml"
          aws s3 cp pickup/deploy/websocket-jmx.yaml "s3://${DEPLOY_S3_BUCKET}/${S3_PREFIX}/websocket-jmx.yaml"
          echo "업로드 완료: s3://${DEPLOY_S3_BUCKET}/${S3_PREFIX}/"

      - name: Send deploy command via SSM
        id: send-command
        run: |
          set -euo pipefail

          cat > /tmp/ssm-params.json <<JSON
          {
            "commands": [
              "export PATH=\$PATH:/snap/bin:/usr/local/bin",
              "set -e",
              "aws s3 cp s3://${DEPLOY_S3_BUCKET}/${S3_PREFIX}/deploy.sh /tmp/pickup-deploy.sh --quiet",
              "chmod +x /tmp/pickup-deploy.sh",
              "/tmp/pickup-deploy.sh s3://${DEPLOY_S3_BUCKET}/${S3_PREFIX}"
            ],
            "executionTimeout": ["600"]
          }
          JSON

          python3 -c "import json; json.load(open('/tmp/ssm-params.json'))" \
            || { echo "::error::SSM 파라미터 JSON 생성 실패"; cat /tmp/ssm-params.json; exit 1; }

          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids ${{ steps.resolve-targets.outputs.instance_ids }} \
            --comment "pickup deploy ${GITHUB_SHA:0:7}" \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId --output text)

          console_url="https://${AWS_REGION}.console.aws.amazon.com/systems-manager/run-command/${command_id}?region=${AWS_REGION}"
          {
            echo "command_id=${command_id}"
            echo "console_url=${console_url}"
          } >> "$GITHUB_OUTPUT"
          echo "SSM 명령 전송: ${command_id}"
          echo "${console_url}"

      - name: Wait for deploy to finish
        id: wait
        run: |
          set +e
          set -uo pipefail
          cid="${{ steps.send-command.outputs.command_id }}"
          overall=0
          failed_instances=""
          last_line=""
          app_reason=""
          results=""

          for id in ${{ steps.resolve-targets.outputs.instance_ids }}; do
            status="Pending"
            for _ in $(seq 1 120); do
              status=$(aws ssm get-command-invocation \
                --command-id "${cid}" --instance-id "${id}" \
                --query Status --output text 2>/dev/null || echo "Pending")
              case "${status}" in
                Success) break ;;
                Failed|Cancelled|TimedOut|Undeliverable|Terminated) break ;;
                *) sleep 5 ;;
              esac
            done

            out=$(aws ssm get-command-invocation --command-id "${cid}" --instance-id "${id}" \
                    --query StandardOutputContent --output text 2>/dev/null || echo "")
            err=$(aws ssm get-command-invocation --command-id "${cid}" --instance-id "${id}" \
                    --query StandardErrorContent --output text 2>/dev/null || echo "")

            echo "::group::${id} — ${status}"
            printf '%s\n' "${out}"
            if [ -n "${err}" ]; then
              echo "--- stderr ---"
              printf '%s\n' "${err}"
            fi
            echo "::endgroup::"

            r=$(printf '%s' "${out}" | grep -o 'RESULT=[a-z0-9_]*' | tail -1 | cut -d= -f2 || true)
            results="${results} ${r:-unknown}"

            a=$(printf '%s\n' "${out}" | grep -o 'FAILED_APP_LOG=.*' | tail -1 | cut -d= -f2- || true)
            if [ -n "${a}" ]; then
              app_reason="${a}"
            fi

            l=$(printf '%s\n' "${out}" "${err}" | grep '\[deploy\]' | tail -1 || true)
            if [ -n "${l}" ]; then
              last_line="${l}"
            fi

            if [ "${status}" != "Success" ]; then
              overall=1
              failed_instances="${failed_instances} ${id}(${status})"
            fi
          done

          sanitize() {
            printf '%s' "$1" | tr '\n\r\t' '   ' | tr -d '"'"'"'`$\\' | cut -c1-400
          }

          pick() { printf '%s' "${results}" | grep -qw "$1"; }
          if   pick no_rollback_target;  then rollback_text="롤백 불가 (직전 버전 없음) — 서비스 중단 가능"
          elif pick rollback_failed;     then rollback_text="롤백했으나 헬스체크 실패 — 서비스 중단 가능"
          elif pick rollback_unverified; then rollback_text="롤백했으나 실행 버전 확인 불가 — 수동 확인 필요"
          elif pick rolled_back;         then rollback_text="롤백 완료 — 직전 버전으로 정상 동작 중"
          elif pick precondition_failed; then rollback_text="배포 시작 전 중단 — jar 교체되지 않음"
          elif pick success;             then rollback_text="롤백 없음"
          else                                rollback_text="상태 불명 (RESULT 마커 없음) — 로그 확인 필요"
          fi

          {
            echo "failed_instances=$(sanitize "${failed_instances}")"
            echo "last_log=$(sanitize "${last_line}")"
            echo "app_reason=$(sanitize "${app_reason}")"
            echo "rollback_text=$(sanitize "${rollback_text}")"
            echo "results=$(sanitize "${results}")"
          } >> "$GITHUB_OUTPUT"

          exit "${overall}"

      - name: Determine failed step
        id: failure-info
        if: failure()
        env:
          FAILED_INSTANCES: ${{ steps.wait.outputs.failed_instances }}
          LAST_LOG: ${{ steps.wait.outputs.last_log }}
          APP_REASON: ${{ steps.wait.outputs.app_reason }}
        run: |
          FAILED_STEP="알 수 없는 단계"
          FAILED_REASON="원인 미상 — 아래 로그 링크에서 상세 내용을 확인하세요."

          if [ "${{ steps.validate-config.outcome }}" = "failure" ]; then
            FAILED_STEP="배포 설정 검증"
            FAILED_REASON="필수 Variables/Secrets 가 비어 있거나 형식이 잘못되었습니다. 워크플로 로그의 '비어 있습니다'/'형식이 올바르지 않습니다' 목록과 backend-cd.yml 의 APP_ENV_ 블록을 대조하세요."
          elif [ "${{ steps.download-jar.outcome }}" = "failure" ]; then
            FAILED_STEP="JAR 아티팩트 다운로드"
            FAILED_REASON="CI 워크플로에서 빌드된 app-jar 아티팩트를 찾지 못했습니다."
          elif [ "${{ steps.runtime-env.outcome }}" = "failure" ]; then
            FAILED_STEP="런타임 환경변수 파일 생성"
            FAILED_REASON="runtime.env 생성에 실패했습니다. backend-cd.yml 의 APP_ENV_ 블록을 확인하세요."
          elif [ "${{ steps.aws-auth.outcome }}" = "failure" ]; then
            FAILED_STEP="AWS OIDC 인증"
            FAILED_REASON="AssumeRoleWithWebIdentity 가 거부됐습니다. IAM 역할 신뢰 정책의 sub 조건(repo/브랜치)과 AWS_DEPLOY_ROLE_ARN 을 확인하세요."
          elif [ "${{ steps.resolve-targets.outcome }}" = "failure" ]; then
            FAILED_STEP="대상 인스턴스 조회"
            FAILED_REASON="태그 Service=${TAG_SERVICE}, Environment=${TAG_ENVIRONMENT} 로 SSM 에 Online 인 인스턴스를 찾지 못했습니다. 태그 값과 SSM Agent 상태를 확인하세요."
          elif [ "${{ steps.upload.outcome }}" = "failure" ]; then
            FAILED_STEP="S3 업로드"
            FAILED_REASON="s3://${DEPLOY_S3_BUCKET}/${S3_PREFIX}/ 업로드가 실패했습니다. 버킷 이름과 배포 역할의 s3:PutObject 권한을 확인하세요."
          elif [ "${{ steps.send-command.outcome }}" = "failure" ]; then
            FAILED_STEP="SSM 명령 전송"
            FAILED_REASON="send-command 가 실패했습니다. 배포 역할의 ssm:SendCommand 권한과 인스턴스 태그 조건을 확인하세요."
          elif [ "${{ steps.wait.outcome }}" = "failure" ]; then
            FAILED_STEP="EC2 배포 실행"
            if [ -n "${APP_REASON:-}" ]; then
              FAILED_REASON="${APP_REASON}"
            else
              FAILED_REASON="${LAST_LOG:-deploy.sh 가 실패했습니다.}"
            fi
            if [ -n "${FAILED_INSTANCES:-}" ]; then
              FAILED_REASON="${FAILED_REASON} / 실패한 인스턴스:${FAILED_INSTANCES}"
            fi
          fi

          {
            echo "failed_step=$FAILED_STEP"
            echo "failed_reason=$FAILED_REASON"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_CICD_BOT_TOKEN }}
          payload: |
            channel: pickup-cicd
            text: "Prod 환경 배포 성공: ${{ github.repository }}@${{ github.sha }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "✅ Prod 환경 배포 성공"
                  emoji: true
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*저장소*\n${{ github.repository }}"
                  - type: mrkdwn
                    text: "*브랜치*\n${{ github.ref_name }}"
                  - type: mrkdwn
                    text: "*커밋*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                  - type: mrkdwn
                    text: "*실행자*\n${{ github.actor }}"
                  - type: mrkdwn
                    text: "*대상 인스턴스*\n${{ steps.resolve-targets.outputs.instance_count }}대"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|워크플로 실행 로그> · <${{ steps.send-command.outputs.console_url }}|SSM 실행 기록>"

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_CICD_BOT_TOKEN }}
          payload: |
            channel: pickup-cicd
            text: "Prod 환경 배포 실패: ${{ github.repository }}@${{ github.sha }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "❌ Prod 환경 배포 실패"
                  emoji: true
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*저장소*\n${{ github.repository }}"
                  - type: mrkdwn
                    text: "*브랜치*\n${{ github.ref_name }}"
                  - type: mrkdwn
                    text: "*커밋*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                  - type: mrkdwn
                    text: "*실행자*\n${{ github.actor }}"
                  - type: mrkdwn
                    text: "*실패 단계*\n${{ steps.failure-info.outputs.failed_step }}"
                  - type: mrkdwn
                    text: "*롤백*\n${{ steps.wait.outputs.rollback_text }}"
              - type: section
                text:
                  type: mrkdwn
                  text: "*실패 사유*\n${{ steps.failure-info.outputs.failed_reason }}"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|워크플로 실행 로그>"

  websocket-load-test:
    name: k6 WebSocket load test
    needs: deploy
    if: ${{ success() && github.ref_name == 'OOTD-412-웹소켓-부하테스트' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare results directory
        run: mkdir -p pickup/load-test/results

      - name: Validate load-test secrets
        env:
          TEST_BASE_URL: https://d38qqh1zkovln3.cloudfront.net/api
          TEST_WS_URL: wss://d38qqh1zkovln3.cloudfront.net/api/ws
          TEST_ORIGIN: https://d38qqh1zkovln3.cloudfront.net
          TEST_AUCTION_IDS: 346
          TEST_LOGIN_ID: ${{ secrets.TEST_LOGIN_ID }}
          TEST_LOGIN_PASSWORD: ${{ secrets.TEST_LOGIN_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${TEST_BASE_URL}" ] || missing+=(TEST_BASE_URL)
          [ -n "${TEST_WS_URL}" ] || missing+=(TEST_WS_URL)
          [ -n "${TEST_ORIGIN}" ] || missing+=(TEST_ORIGIN)
          [ -n "${TEST_AUCTION_IDS}" ] || missing+=(TEST_AUCTION_IDS)
          [ -n "${TEST_LOGIN_ID}" ] || missing+=(TEST_LOGIN_ID)
          [ -n "${TEST_LOGIN_PASSWORD}" ] || missing+=(TEST_LOGIN_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::부하테스트 Secret이 없습니다: ${missing[*]}"
            exit 1
          fi

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run idle WebSocket capacity test
        continue-on-error: true
        env:
          TEST_WS_URL: wss://d38qqh1zkovln3.cloudfront.net/api/ws
          TEST_ORIGIN: https://d38qqh1zkovln3.cloudfront.net
          TEST_AUCTION_IDS: 346
          TARGET_VUS: 300
          RAMP_SECONDS: 60
          HOLD_SECONDS: 120
        run: |
          set +e
          echo "유휴 연결 시험 시작: ${TARGET_VUS} sessions"
          k6 run \
            --summary-export="pickup/load-test/results/idle-${TARGET_VUS}.json" \
            pickup/load-test/k6/idle-websocket.js
          result=$?
          echo "자원 회수를 위해 60초 대기"
          sleep 60
          exit ${result}

      - name: Run bid to WebSocket capacity test
        continue-on-error: true
        env:
          TEST_BASE_URL: https://d38qqh1zkovln3.cloudfront.net/api
          TEST_WS_URL: wss://d38qqh1zkovln3.cloudfront.net/api/ws
          TEST_ORIGIN: https://d38qqh1zkovln3.cloudfront.net
          TEST_AUCTION_IDS: 346
          TEST_LOGIN_ID: ${{ secrets.TEST_LOGIN_ID }}
          TEST_LOGIN_PASSWORD: ${{ secrets.TEST_LOGIN_PASSWORD }}
          TEST_INITIAL_BID_PRICE: 1500000
          TEST_BID_INCREMENT: 43000
          BID_INTERVAL_SECONDS: 1
          TARGET_VUS: 300
          RAMP_SECONDS: 60
          HOLD_SECONDS: 120
        run: |
          set +e
          echo "입찰 E2E 시험 시작: ${TARGET_VUS} sessions"
          k6 run \
            --summary-export="pickup/load-test/results/bid-e2e-${TARGET_VUS}.json" \
            pickup/load-test/k6/bid-websocket-e2e.js
          result=$?
          echo "자원 회수를 위해 60초 대기"
          sleep 60
          exit ${result}

      - name: Run production-aligned reconnect test
        continue-on-error: true
        env:
          TEST_WS_URL: wss://d38qqh1zkovln3.cloudfront.net/api/ws
          TEST_ORIGIN: https://d38qqh1zkovln3.cloudfront.net
          TEST_AUCTION_IDS: 346
          RECONNECT_CYCLES: 3
          FIRST_CONNECTION_SECONDS: 60
          RECONNECT_HOLD_SECONDS: 20
          RECONNECT_BACKOFF_ENABLED: true
          TARGET_VUS: 300
        run: |
          set +e
          echo "성공 후 attempt 초기화를 반영한 backoff와 jitter 재연결 시험 시작: ${TARGET_VUS} sessions"
          k6 run \
            --summary-export="pickup/load-test/results/reconnect-after-${TARGET_VUS}.json" \
            pickup/load-test/k6/reconnect-storm.js
          result=$?
          echo "자원 회수를 위해 60초 대기"
          sleep 60
          exit ${result}

      - name: Create report
        if: always()
        run: |
          mkdir -p pickup/load-test/results
          node pickup/load-test/k6/create-capacity-report.mjs pickup/load-test/results

      - name: Upload load-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: websocket-load-test-${{ github.sha }}
          path: pickup/load-test/results
          if-no-files-found: warn
          retention-days: 14
