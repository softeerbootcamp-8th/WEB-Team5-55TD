name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'pickup/**'
      - '.github/workflows/backend-ci.yml'
  workflow_call:
    inputs:
      upload-jar:
        description: '빌드된 실행형 jar를 아티팩트로 업로드할지 여부 (CD에서 사용)'
        type: boolean
        default: false

defaults:
  run:
    working-directory: pickup

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build & Test
        run: ./gradlew clean build --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            pickup/build/reports/tests/test
            pickup/build/test-results/test
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload application jar
        if: ${{ inputs.upload-jar }}
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: |
            pickup/build/libs/pickup-*.jar
            !pickup/build/libs/*-plain.jar
          if-no-files-found: error
