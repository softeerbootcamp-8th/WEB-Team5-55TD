name: Frontend CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'fe-pickup/**'
      - '.github/workflows/frontend-ci.yml'
  # 임의 브랜치에서 수동 실행. 다른 PR 의 브랜치를 골라 CI 통과 여부를
  # 미리 확인할 때 쓴다.
  # 주의: 이 워크플로 파일이 기본 브랜치(develop)에 올라간 뒤에야
  # Actions 탭의 "Run workflow" 버튼이 나타난다.
  workflow_dispatch:

  workflow_call:
    inputs:
      upload-dist:
        description: '빌드 산출물(dist)을 아티팩트로 업로드할지 여부 (CD에서 사용)'
        type: boolean
        default: false

# PR 에 커밋을 연달아 푸시하면 이전 실행은 의미가 없으므로 취소한다.
# 단 CD 가 workflow_call 로 부른 실행은 취소되면 안 된다.
# 그때는 event_name 이 push 라서 cancel-in-progress 가 false 가 되고,
# pull_request.number 도 비어 있어 group 이 커밋 SHA 기준으로 잡힌다.
concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: fe-pickup

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # packageManager 필드("pnpm@11.15.1")에서 버전을 읽는다.
      # 저장소 루트에는 package.json 이 없으므로 경로를 명시해야 한다.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: fe-pickup/package.json
          run_install: false

      # cache: pnpm 은 `pnpm store path` 를 호출하므로 pnpm 설치 뒤에 와야 한다.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: fe-pickup/pnpm-lock.yaml

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # src/api/generated 는 .gitignore 대상이라 체크아웃에 존재하지 않는다.
      # 이 단계를 건너뛰면 이후 타입 검사가 모듈을 찾지 못해 실패한다.
      - name: Generate API client
        id: gen-api
        run: pnpm gen:api

      - name: Lint
        id: lint
        run: pnpm lint

      # `/api` 접두사 제거 규칙은 Vite 프록시(로컬)와 CloudFront Function(운영)에
      # 따로 구현되어 있다. CloudFront Functions 런타임에 모듈 시스템이 없어
      # 공유가 불가능하기 때문이다. 한쪽만 고치면 "로컬은 되는데 배포하면 404" 가
      # 되고, CloudFront Function 은 로컬에서 실행할 수 없어 배포 전에는 드러나지 않는다.
      - name: Verify /api rewrite parity
        id: parity
        run: node deploy/verify-rewrite-parity.mjs

      # build = `vite build && tsc -b`.
      # vite 가 routeTree.gen.ts 를 생성한 뒤 tsc 가 타입을 검사하므로,
      # 타입 검사를 위한 별도 스텝을 두지 않는다 (tsc 를 두 번 돌릴 이유가 없다).
      - name: Build
        id: build
        env:
          # CloudFront 가 /api/* 를 백엔드로 넘기므로 상대 경로면 충분하다.
          # Vite 는 이 값을 번들에 문자열로 박아 넣는다 — 런타임 변경 불가.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}
        run: pnpm build

      - name: Determine failed step
        id: failure-info
        if: failure()
        run: |
          FAILED_STEP="알 수 없는 단계"
          FAILED_REASON="원인 미상 — 아래 로그 링크에서 상세 내용을 확인하세요."

          if [ "${{ steps.install.outcome }}" = "failure" ]; then
            FAILED_STEP="의존성 설치"
            FAILED_REASON="pnpm install --frozen-lockfile 이 실패했습니다. package.json 을 고친 뒤 pnpm-lock.yaml 을 함께 커밋했는지 확인하세요."
          elif [ "${{ steps.gen-api.outcome }}" = "failure" ]; then
            FAILED_STEP="API 클라이언트 생성"
            FAILED_REASON="orval 이 openapi.yaml 을 변환하지 못했습니다. 스펙 문법과 orval.config.ts 를 확인하세요."
          elif [ "${{ steps.lint.outcome }}" = "failure" ]; then
            FAILED_STEP="ESLint"
            FAILED_REASON="lint 규칙 위반이 있습니다. 로컬에서 pnpm lint:fix 로 자동 수정할 수 있습니다."
          elif [ "${{ steps.parity.outcome }}" = "failure" ]; then
            FAILED_STEP="/api rewrite 규칙 불일치"
            FAILED_REASON="Vite 프록시와 CloudFront Function 의 동작이 다릅니다. fe-pickup/deploy/strip-api-prefix.ts 와 fe-pickup/deploy/cloudfront-function.js 를 함께 고치세요."
          elif [ "${{ steps.build.outcome }}" = "failure" ]; then
            FAILED_STEP="빌드 · 타입 검사"
            FAILED_REASON="vite build 또는 tsc 타입 검사가 실패했습니다. 로그의 TS 에러 코드를 확인하세요."
          fi

          {
            echo "failed_step=$FAILED_STEP"
            echo "failed_reason=$FAILED_REASON"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_CICD_BOT_TOKEN }}
          payload: |
            channel: pickup-cicd
            text: "Frontend CI 성공: ${{ github.repository }}@${{ github.sha }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "✅ Frontend CI 통과"
                  emoji: true
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*저장소*\n${{ github.repository }}"
                  - type: mrkdwn
                    text: "*브랜치*\n${{ github.ref_name }}"
                  - type: mrkdwn
                    text: "*커밋*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                  - type: mrkdwn
                    text: "*실행자*\n${{ github.actor }}"
                  - type: mrkdwn
                    text: "*검사 항목*\nESLint · rewrite 규칙 · 타입 검사 · 빌드"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|워크플로 실행 로그 보기>"

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_CICD_BOT_TOKEN }}
          payload: |
            channel: pickup-cicd
            text: "Frontend CI 실패: ${{ github.repository }}@${{ github.sha }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "❌ Frontend CI 실패"
                  emoji: true
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*저장소*\n${{ github.repository }}"
                  - type: mrkdwn
                    text: "*브랜치*\n${{ github.ref_name }}"
                  - type: mrkdwn
                    text: "*커밋*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                  - type: mrkdwn
                    text: "*실행자*\n${{ github.actor }}"
                  - type: mrkdwn
                    text: "*실패 단계*\n${{ steps.failure-info.outputs.failed_step }}"
              - type: section
                text:
                  type: mrkdwn
                  text: "*실패 사유*\n${{ steps.failure-info.outputs.failed_reason }}"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|워크플로 실행 로그 보기>"

      # CD 가 이 워크플로를 부를 때만 업로드한다.
      # 앞 스텝이 하나라도 실패하면 여기까지 오지 않으므로,
      # 타입 검사에 실패한 dist 가 배포로 넘어갈 경로는 없다.
      - name: Upload dist
        if: ${{ inputs.upload-dist }}
        uses: actions/upload-artifact@v4
        with:
          name: fe-dist
          path: fe-pickup/dist
          if-no-files-found: error
          retention-days: 7
