apiVersion: apps/v1
kind: Deployment
metadata:
  name: pickup-redis
  namespace: pickup
  labels:
    app: pickup-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pickup-redis
  template:
    metadata:
      labels:
        app: pickup-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pickup-redis-service
  namespace: pickup
  labels:
    app: pickup-redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app: pickup-redis
