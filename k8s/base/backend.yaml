apiVersion: apps/v1
kind: Deployment
metadata:
  name: pickup-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pickup-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pickup-api
    spec:
      containers:
        - name: api
          image: pickup-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: DD_ENV
              value: qa
            - name: DD_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
          envFrom:
            - secretRef:
                name: pickup-api-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pickup-api
spec:
  selector:
    app.kubernetes.io/name: pickup-api
  ports:
    - name: http
      port: 8080
      targetPort: http
