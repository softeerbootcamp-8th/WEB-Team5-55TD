apiVersion: v1
kind: ConfigMap
metadata:
  name: pickup-localstack-init
  namespace: pickup
data:
  10-init-resources.sh: |-
    #!/bin/sh
    set -eu

    awslocal sqs create-queue \
      --queue-name pickup-events.fifo \
      --attributes FifoQueue=true,ContentBasedDeduplication=true

    if ! awslocal s3api head-bucket --bucket pickup-media-bucket; then
      awslocal s3api create-bucket \
        --bucket pickup-media-bucket \
        --create-bucket-configuration LocationConstraint=ap-northeast-2
    fi

    if [ -d /var/lib/localstack/object-backup/s3 ]; then
      awslocal s3 sync \
        /var/lib/localstack/object-backup/s3 \
        s3://pickup-media-bucket
    fi
  20-backup-s3.sh: |-
    #!/bin/sh
    set -eu

    mkdir -p /data/object-backup/s3
    awslocal s3 sync \
      s3://pickup-media-bucket \
      /data/object-backup/s3 \
      --delete
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pickup-localstack-pvc
  namespace: pickup
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pickup-localstack
  namespace: pickup
  labels:
    app: pickup-localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pickup-localstack
  template:
    metadata:
      labels:
        app: pickup-localstack
    spec:
      containers:
      - name: localstack
        image: localstack/localstack:3.8.1
        env:
        - name: SERVICES
          value: "sqs,s3"
        - name: AWS_DEFAULT_REGION
          value: "ap-northeast-2"
        ports:
        - containerPort: 4566
          name: localstack
        volumeMounts:
        - name: init-resources
          mountPath: /etc/localstack/init/ready.d
          readOnly: true
        - name: localstack-data
          mountPath: /var/lib/localstack
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      volumes:
      - name: init-resources
        configMap:
          name: pickup-localstack-init
          defaultMode: 0755
      - name: localstack-data
        persistentVolumeClaim:
          claimName: pickup-localstack-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pickup-localstack-service
  namespace: pickup
  labels:
    app: pickup-localstack
spec:
  type: NodePort
  ports:
  - port: 4566
    targetPort: 4566
    nodePort: 30466
    name: localstack
  selector:
    app: pickup-localstack
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pickup-localstack-bootstrap
  namespace: pickup
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: bootstrap
            image: localstack/localstack:3.8.1
            command:
            - /bin/sh
            - /bootstrap/20-backup-s3.sh
            env:
            - name: AWS_ENDPOINT_URL
              value: "http://pickup-localstack-service.pickup.svc.cluster.local:4566"
            - name: AWS_DEFAULT_REGION
              value: "ap-northeast-2"
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
            volumeMounts:
            - name: init-resources
              mountPath: /bootstrap
              readOnly: true
            - name: localstack-data
              mountPath: /data
          volumes:
          - name: init-resources
            configMap:
              name: pickup-localstack-init
              defaultMode: 0755
          - name: localstack-data
            persistentVolumeClaim:
              claimName: pickup-localstack-pvc
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: pickup-localstack
                topologyKey: kubernetes.io/hostname
