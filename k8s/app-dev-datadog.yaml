---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pickup-api
  namespace: pickup
  labels:
    app: pickup-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pickup-api
  template:
    metadata:
      labels:
        app: pickup-api
        tags.datadoghq.com/env: "development"
        tags.datadoghq.com/service: "pickup-api"
        tags.datadoghq.com/version: "v1.0.0"
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      initContainers:
      - name: fetch-datadog-tracer
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - "curl -L -o /opt/datadog/dd-java-agent.jar https://dtdg.co/latest-java-tracer"
        volumeMounts:
        - name: datadog-agent-volume
          mountPath: /opt/datadog
      containers:
      - name: pickup-api
        image: ghcr.io/delphox60/pickup-api:latest
        imagePullPolicy: Always
        env:
        - name: DD_ENV
          value: "development"
        - name: DD_SERVICE
          value: "pickup-api"
        - name: DD_VERSION
          value: "v1.0.0"
        - name: DD_AGENT_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: DD_TRACE_AGENT_PORT
          value: "8126"
        - name: DD_PROFILING_ENABLED
          value: "true"
        - name: DD_LOGS_INJECTION
          value: "true"
        - name: DD_TRACE_DB_CLIENT_SPLIT_BY_INSTANCE
          value: "true"
        - name: JAVA_TOOL_OPTIONS
          value: "-javaagent:/opt/datadog/dd-java-agent.jar -Ddd.jmxfetch.config.dir=/opt/datadog/jmx -Ddd.jmxfetch.config=hikaricp.yaml,tomcat.yaml -Ddd.jmxfetch.check-period=15000 -Ddd.jmxfetch.refresh-beans-period=60 -Ddd.jmxfetch.initial-refresh-beans-period=15 -Dspring.datasource.hikari.register-mbeans=true"
        envFrom:
        - secretRef:
            name: pickup-api-secret
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: datadog-agent-volume
          mountPath: /opt/datadog
        - name: jmx-config-volume
          mountPath: /opt/datadog/jmx
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
      volumes:
      - name: datadog-agent-volume
        emptyDir: {}
      - name: jmx-config-volume
        configMap:
          name: pickup-jmx-config

---
apiVersion: v1
kind: Service
metadata:
  name: pickup-api-service
  namespace: pickup
  labels:
    app: pickup-api
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    name: http
  selector:
    app: pickup-api
