apiVersion: v1
kind: ConfigMap
metadata:
  name: pickup-jmx-config
  namespace: pickup
data:
  hikaricp.yaml: |
    init_config:
      is_jmx: true
    instances:
      - name: pickup-hikaricp
        jvm_direct: true
        collect_default_jvm_metrics: false
        conf:
          - include:
              domain: com.zaxxer.hikari
              bean_regex:
                - 'com\.zaxxer\.hikari:type=Pool \((.*)\)'
              tags:
                pool: $1
              attribute:
                ActiveConnections:
                  alias: hikaricp.connections.active
                  metric_type: gauge
                IdleConnections:
                  alias: hikaricp.connections.idle
                  metric_type: gauge
                TotalConnections:
                  alias: hikaricp.connections.total
                  metric_type: gauge
                ThreadsAwaitingConnection:
                  alias: hikaricp.connections.pending
                  metric_type: gauge
          - include:
              domain: com.zaxxer.hikari
              bean_regex:
                - 'com\.zaxxer\.hikari:type=PoolConfig \((.*)\)'
              tags:
                pool: $1
              attribute:
                MaximumPoolSize:
                  alias: hikaricp.connections.max
                  metric_type: gauge
                MinimumIdle:
                  alias: hikaricp.connections.min
                  metric_type: gauge

  tomcat.yaml: |
    init_config:
      is_jmx: true
    instances:
      - name: pickup-tomcat
        jvm_direct: true
        collect_default_jvm_metrics: false
        conf:
          - include:
              domain_regex: Catalina|Tomcat
              type: ThreadPool
              attribute:
                maxThreads:
                  alias: tomcat.threads.max
                  metric_type: gauge
                currentThreadCount:
                  alias: tomcat.threads.count
                  metric_type: gauge
                currentThreadsBusy:
                  alias: tomcat.threads.busy
                  metric_type: gauge
                minSpareThreads:
                  alias: tomcat.threads.min
                  metric_type: gauge
                connectionCount:
                  alias: tomcat.connections.current
                  metric_type: gauge
                keepAliveCount:
                  alias: tomcat.connections.keep_alive
                  metric_type: gauge
                maxConnections:
                  alias: tomcat.connections.max
                  metric_type: gauge
          - include:
              domain_regex: Catalina|Tomcat
              type: GlobalRequestProcessor
              attribute:
                requestCount:
                  alias: tomcat.request_count
                  metric_type: counter
                errorCount:
                  alias: tomcat.error_count
                  metric_type: counter
                processingTime:
                  alias: tomcat.processing_time
                  metric_type: counter
                maxTime:
                  alias: tomcat.max_time
                  metric_type: gauge

