apiVersion: v1
kind: Secret
metadata:
  name: pickup-api-secret
  namespace: pickup
type: Opaque
stringData:
  DB_URL: "jdbc:mysql://pickup-db-service.pickup.svc.cluster.local:3306/pickup?serverTimezone=UTC&characterEncoding=UTF-8"
  DB_USERNAME: "pickup"
  DB_PASSWORD: "pickuppass"
  REDIS_HOST: "pickup-redis-service.pickup.svc.cluster.local"
  REDIS_PORT: "6379"
  JWT_SECRET: "cGlja3Vwc2VjcmV0a2V5cGlja3Vwc2VjcmV0a2V5MzJi"
  IMAGE_STORAGE_BUCKET: "pickup-media-bucket"
  IMAGE_STORAGE_REGION: "ap-northeast-2"
  IMAGE_MEDIA_BASE_URL: "http://192.168.68.52:30466/pickup-media-bucket"
  IMAGE_UPLOAD_URL_TTL: "5m"
  WEBSOCKET_ALLOWED_ORIGINS: "*"
  SPRING_PROFILES_ACTIVE: "prod"
  DB_POOL_MAX_SIZE: "20"
  EVENT_SQS_ENABLED: "true"
  EVENT_SQS_QUEUE_URL: "http://pickup-localstack-service.pickup.svc.cluster.local:4566/000000000000/pickup-events.fifo"
  EVENT_SQS_REGION: "ap-northeast-2"
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  AWS_ENDPOINT_URL: "http://pickup-localstack-service.pickup.svc.cluster.local:4566"
  AWS_ENDPOINT_URL_S3: "http://192.168.68.52:30466"
  AWS_ENDPOINT_URL_SQS: "http://pickup-localstack-service.pickup.svc.cluster.local:4566"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pickup-api
  namespace: pickup
  labels:
    app: pickup-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pickup-api
  template:
    metadata:
      labels:
        app: pickup-api
        tags.datadoghq.com/env: "development"
        tags.datadoghq.com/service: "pickup-api"
        tags.datadoghq.com/version: "v1.0.0"
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: pickup-api
        image: ghcr.io/delphox60/pickup-api:latest
        imagePullPolicy: Always
        env:
        - name: TZ
          value: "UTC"
        - name: DD_ENV
          value: "development"
        - name: DD_SERVICE
          value: "pickup-api"
        - name: DD_VERSION
          value: "v1.0.0"
        envFrom:
        - secretRef:
            name: pickup-api-secret
        ports:
        - containerPort: 8080
          name: http
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 25
          periodSeconds: 5
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pickup-api-service
  namespace: pickup
  labels:
    app: pickup-api
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    name: http
  selector:
    app: pickup-api
