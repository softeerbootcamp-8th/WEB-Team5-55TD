apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pickup-mysql-pvc
  namespace: pickup
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pickup-mysql
  namespace: pickup
  labels:
    app: pickup-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pickup-mysql
  template:
    metadata:
      labels:
        app: pickup-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "pickuppass"
        - name: MYSQL_DATABASE
          value: "pickup"
        - name: MYSQL_USER
          value: "pickup"
        - name: MYSQL_PASSWORD
          value: "pickuppass"
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-persistent-storage
          mountPath: /var/lib/mysql
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 3Gi
      volumes:
      - name: mysql-persistent-storage
        persistentVolumeClaim:
          claimName: pickup-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pickup-db-service
  namespace: pickup
  labels:
    app: pickup-mysql
spec:
  type: NodePort
  ports:
  - port: 3306
    targetPort: 3306
    nodePort: 30307
    name: mysql
  selector:
    app: pickup-mysql
