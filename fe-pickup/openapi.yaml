openapi: 3.1.0
info:
  title: PickUp API
  description: PickUp API 문서
  version: v1
servers:
- url: /
tags:
- name: Bid
  description: 입찰 API
- name: Sales
  description: 판매 내역 API
- name: Authentication
  description: 로그인 및 토큰 관리 API
- name: Card
  description: 카드 API
- name: Watch
  description: 관심 API
- name: Consignment
  description: 상품 등록 API
- name: Member
  description: 회원 API
- name: Auction
  description: 경매 API
- name: Health Check
  description: 서버 상태 확인 API
- name: Image Upload
  description: 이미지 업로드 API
paths:
  /members:
    post:
      tags:
      - Member
      summary: 회원가입
      description: "로그인 ID, 닉네임, 비밀번호로 회원을 생성합니다."
      operationId: createMember
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRequest"
        required: true
      responses:
        "201":
          description: 회원가입 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "409":
          description: 로그인 ID 또는 닉네임 중복
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
  /image-uploads:
    post:
      tags:
      - Image Upload
      summary: 이미지 업로드 URL 발급
      operationId: createUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImageUploadRequest"
        required: true
      responses:
        "201":
          description: 업로드 URL 발급 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateImageUploadResponse"
        "400":
          description: 지원하지 않는 이미지 형식 또는 크기
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
        "401":
          description: 인증 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
      security:
      - access-token-cookie: []
  /consignments:
    get:
      tags:
      - Consignment
      summary: 내 상품 목록 조회
      description: |
        내가 등록한 상품 목록을 판매 상태(status)로 필터링하여 조회합니다.
        상품 ID 내림차순으로 조회하며, 다음 페이지 조회 시 이전 응답의 cursor를 전달합니다.
      operationId: getMyConsignments
      parameters:
      - name: status
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: 내 상품 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMyConsignmentsPageResponse"
              examples:
                내 상품 목록 조회 결과:
                  description: 내 상품 목록 조회 결과
                  value:
                    hasNext: true
                    cursor: 99
                    size: 1
                    items:
                    - consignmentId: 100
                      auctionId: null
                      card:
                        cardId: 10
                        cardName: 리자몽 1st Edition Holo
                        setName: Base Set
                        cardNumber: 4/102
                        language: 일본어
                        rarity: MINT
                        imageUrl: https://example.com/cards/10.png
                      sellerMemberId: 1
                      majorDefect: 모서리에 약간의 마모
                      status: REGISTERABLE
                      auctionStatus: null
                      auctionStartedAt: null
                      auctionEndedAt: null
                      certificate:
                        certificateId: 200
                        serialNumber: PSA-84213907
                        certificationBody: PSA
                        grade: "10"
                        gradeCode: GEM_MINT
                        inspectedAt: 2026-06-30
        "400":
          description: "잘못된 조회 조건 (필수 파라미터 누락, 유효하지 않은 상태 값 등)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
        "401":
          description: 인증이 필요함 (access-token 쿠키 없음/만료)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
      security:
      - access-token-cookie: []
    post:
      tags:
      - Consignment
      summary: 상품 등록
      description: |
        카드 검색으로 선택한 카드와 감정서, 이미지(앞/뒤 최소 2장) 정보를 받아
        상품을 등록합니다. 이미지 순서는 요청 배열에 담긴 순서를 그대로 사용합니다.
        등록 직후 상태는 REGISTERABLE(등록 가능)로 설정됩니다.
      operationId: registerConsignment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterConsignmentRequest"
            examples:
              상품 등록 요청:
                description: 상품 등록 요청
                value:
                  cardId: 10
                  majorDefect: 모서리에 약간의 마모
                  certificate:
                    serialNumber: PSA-84213907
                    certificationBody: PSA
                    grade: "10"
                    inspectedAt: 2026-06-30
                  images:
                  - temporaryObjectKey: uploads/1/consignments/00000000-0000-0000-0000-000000000001.jpg
                  - temporaryObjectKey: uploads/1/consignments/00000000-0000-0000-0000-000000000002.jpg
        required: true
      responses:
        "201":
          description: 상품 등록 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RegisterConsignmentResponse"
              examples:
                상품 등록 결과:
                  description: 상품 등록 결과
                  value:
                    consignmentId: 100
                    card:
                      cardId: 10
                      cardName: 리자몽 1st Edition Holo
                      setName: Base Set
                      cardNumber: 4/102
                      language: 일본어
                      rarity: MINT
                      imageUrl: https://example.com/cards/10.png
                    sellerMemberId: 1
                    majorDefect: 모서리에 약간의 마모
                    status: REGISTERABLE
                    certificate:
                      certificateId: 200
                      serialNumber: PSA-84213907
                      certificationBody: PSA
                      grade: "10"
                      gradeCode: GEM_MINT
                      inspectedAt: 2026-06-30
        "400":
          description: "요청 값 검증 실패 (필수 값 누락, 이미지 2장 미만, 유효하지 않은 등급/감정기관 등)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
        "401":
          description: 인증이 필요함 (access-token 쿠키 없음/만료)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
        "404":
          description: 카드 또는 회원을 찾을 수 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
        "409":
          description: 이미 등록된 인증서 일련번호
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
      security:
      - access-token-cookie: []
  /auth:
    post:
      tags:
      - Authentication
      summary: 로그인
      description: 아이디와 비밀번호를 검증하고 Access Token과 Refresh Token을 HttpOnly 쿠키로 발급합니다.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: 로그인 성공
          headers:
            Set-Cookie:
              description: access-token과 refresh-token 쿠키를 발급합니다.
              style: simple
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponseBody"
        "400":
          description: 아이디 또는 비밀번호 형식 오류
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
        "401":
          description: 아이디 또는 비밀번호 불일치
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
  /auth/refresh:
    post:
      tags:
      - Authentication
      summary: 토큰 갱신
      description: refresh-token 쿠키를 검증하고 기존 토큰을 폐기한 뒤 새 Access Token과 Refresh Token을
        발급합니다.
      operationId: refresh
      parameters:
      - name: refresh-token
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: 토큰 갱신 성공
          headers:
            Set-Cookie:
              description: 새 access-token과 refresh-token 쿠키를 발급합니다.
              style: simple
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RefreshResponseBody"
        "401":
          description: "Refresh Token이 없거나 유효하지 않음, 또는 토큰 저장소 장애"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
  /auth/kakao:
    post:
      tags:
      - Authentication
      summary: 카카오 로그인
      description: 카카오 인가 코드를 검증하고 최초 로그인 시 자동 가입한 뒤 서비스 토큰 쿠키를 발급합니다.
      operationId: kakaoLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KakaoLoginRequest"
      responses:
        "200":
          description: 카카오 로그인 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponseBody"
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: 로그아웃
      description: refresh-token 쿠키를 폐기하고 Access Token과 Refresh Token 쿠키를 만료합니다.
      operationId: logout
      parameters:
      - name: refresh-token
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "204":
          description: 로그아웃 성공
          headers:
            Set-Cookie:
              description: access-token과 refresh-token 쿠키를 만료합니다.
              style: simple
              schema:
                type: string
  /auctions:
    get:
      tags:
      - Auction
      summary: 경매 목록 조회
      description: |
        검색어(q), 경매 상태(status), 정렬(sort) 조건으로 경매 목록을 커서 기반으로 조회합니다.
        limit이 있으면 커서/hasNext 없이 상위 N개만 반환하는 홈 노출 전용 모드로 동작합니다.
        sellerId/cardId로 같은 판매자·같은 카드의 경매만 좁혀볼 수 있고,
        excludeAuctionId로 특정 경매(예: 현재 보고 있는 상세 화면의 경매)를 결과에서 제외할 수 있습니다.
      operationId: searchAuctions
      parameters:
      - name: memberId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: searchAuctionsRequest
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/SearchAuctionsRequest"
      responses:
        "200":
          description: 경매 목록 조회 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SearchAuctionsPageResponse"
              examples:
                경매 목록 조회 결과:
                  description: 경매 목록 조회 결과
                  value:
                    hasNext: true
                    cursor: string
                    size: 20
                    items:
                    - auctionId: 1
                      consignmentId: 100
                      card:
                        cardId: 10
                        cardName: 리자몽 1st Edition Holo
                        setName: Base Set
                        cardNumber: 4/102
                        language: 일본어
                        rarity: MINT
                        imageUrl: https://example.com/cards/10.png
                      grade: PSA 10
                      auctionStatus: SCHEDULED
                      startingPrice: 10000
                      currentPrice: null
                      startedAt: 2026-08-01T10:00:00
                      endedAt: null
                      remainingSeconds: null
                      watchCount: 0
                      watched: false
                      thumbnailUrl: https://example.com/consignments/100-front.png
        "400":
          description: "요청 값 검증 실패 (잘못된 sort/status/cursor, size/limit 오류 등)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
    post:
      tags:
      - Auction
      summary: 경매 신청
      description: |
        위탁상품에 대한 경매 개최를 신청합니다. 신청이 접수되면 경매 상태는
        SCHEDULED(예정)로 생성되고, 위탁상품 상태는 IN_AUCTION으로 전환됩니다.
        bidIncrement(입찰 단위)는 시작가의 5%로 시스템이 결정합니다.
      operationId: registerAuction
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuctionRequest"
            examples:
              경매 신청 요청:
                description: 경매 신청 요청
                value:
                  consignmentId: 100
                  startingPrice: 10000
                  reserve: 15000
                  scheduledStartAt: 2026-08-01T21:00:00
        required: true
      responses:
        "201":
          description: 경매 신청 완료
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateAuctionResponse"
              examples:
                경매 신청 결과:
                  description: 경매 신청 결과
                  value:
                    auctionId: 1
                    consignmentId: 100
                    auctionStatus: SCHEDULED
                    startingPrice: 10000
                    bidIncrement: 500
                    startedAt: 2026-08-01T21:00:00
                    endedAt: 2026-08-08T21:00:00
                    winningBidId: null
                    winningPrice: null
                    createdAt: 2026-07-29T12:00:00
        "400":
          description: "요청 값 검증 실패 (필수 값 누락, 시작가/최소 낙찰가 오류, 과거 일정 등)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
        "403":
          description: 본인 소유의 위탁상품이 아님
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
        "404":
          description: 위탁상품을 찾을 수 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
        "409":
          description: 이미 경매 진행/예정 중이거나 신청 불가 상태
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
  /auctions/{auctionId}/watch:
    post:
      tags:
      - Watch
      summary: 관심 등록
      operationId: registerWatch
      parameters:
      - name: auctionId
        in: path
        description: 경매 ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "201":
          description: 관심 등록 완료
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WatchResponse"
              example:
                watchId: 1
                memberId: 1
                auctionId: 100
                createdAt: 2026-07-31T12:00:00
        "401":
          description: 인증이 필요함
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
        "404":
          description: 회원 또는 경매를 찾을 수 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
        "409":
          description: 이미 관심 등록한 경매
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
      security:
      - access-token-cookie: []
    delete:
      tags:
      - Watch
      summary: 관심 해제
      operationId: deleteWatch
      parameters:
      - name: auctionId
        in: path
        description: 경매 ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: 관심 해제 완료
        "401":
          description: 인증이 필요함
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
      security:
      - access-token-cookie: []
  /auctions/{auctionId}/bids:
    get:
      tags:
      - Bid
      summary: 경매 입찰 내역 조회
      description: |
        해당 경매의 입찰 내역을 최근 입찰 순으로 조회합니다. 닉네임은 그대로 노출되며,
        로그인한 회원 본인의 입찰에는 isMine=true가 표시됩니다. 비로그인 상태로도 조회할 수 있습니다.
      operationId: getAuctionBids
      parameters:
      - name: auctionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: getAuctionBidsRequest
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/GetAuctionBidsRequest"
      responses:
        "200":
          description: 입찰 내역 조회 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuctionBidsPageResponse"
        "400":
          description: 유효하지 않은 커서 값
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
        "404":
          description: 경매를 찾을 수 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
    post:
      tags:
      - Bid
      summary: 입찰
      description: |
        진행 중인 경매에 입찰합니다.
        입찰가는 현재가보다 높고 현재가에서 최소 입찰 단위 이상 증가한 금액이어야 합니다.
      operationId: placeBid
      parameters:
      - name: auctionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceBidRequest"
            examples:
              입찰 요청:
                description: 입찰 요청
                value:
                  bidPrice: 10500
        required: true
      responses:
        "201":
          description: 입찰 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlaceBidResponse"
              examples:
                입찰 결과:
                  description: 입찰 결과
                  value:
                    bidId: 1
                    auctionId: 1
                    memberId: 2
                    bidPrice: 10500
                    bidStatus: HIGHEST
                    createdAt: 2026-07-30T12:00:00
        "400":
          description: 입찰가 누락 또는 양수가 아닌 입찰가
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
        "401":
          description: 인증 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
        "403":
          description: 판매자 본인의 경매에 입찰
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
        "404":
          description: 경매를 찾을 수 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
        "409":
          description: "입찰 불가 (AUCTION_NOT_STARTED, AUCTION_ENDED, OUTBID_EXISTS,\
            \ BELOW_MIN_INCREMENT)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionResponse"
      security:
      - access-token-cookie: []
  /auctions/{auctionId}/bid-requests:
    post:
      tags:
      - Bid
      summary: 입찰 요청 생성
      description: |
        입찰 요청을 접수합니다. 이 API는 가벼운 검증(경매 존재 여부, 입찰가 형식)만 하고 즉시 202를 반환합니다.
        실제 입찰 처리(현재가·최소 증가폭·판매자 본인 여부·포인트 한도 검증, 저장)는 비동기로 수행되며,
        같은 경매의 요청은 접수된 순서대로 처리됩니다.
        처리 결과는 REST 응답이 아니라 WebSocket으로 전달됩니다 —
        성공은 `/topic/auctions/{auctionId}` 브로드캐스트, 실패는 `/user/queue/bid-requests` 유니캐스트입니다.
